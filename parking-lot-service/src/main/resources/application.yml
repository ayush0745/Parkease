spring:
  application:
    name: parking-lot-service
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://localhost:3307/parkease_parking_lots?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: parkease_user
    password: parkease_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

jwt:
  secret: "2dEC87cE0KSPZmT1nH4+T5FaB35+6+F/omeu3Qlxnvg="

# Inter-service URLs for notification dispatch
services:
  auth-url: http://localhost:8081
  notification-url: http://localhost:8087